apiVersion: apps/v1
kind: Deployment
metadata:
  name: aether-api
  namespace: default
  labels:
    app.kubernetes.io/name: aether-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: aether-platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aether-api
  template:
    metadata:
      labels:
        app: aether-api
        app.kubernetes.io/name: aether-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: api
        image: aether/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
        env:
        - name: QDRANT_URL
          valueFrom:
            secretKeyRef:
              name: aether-secrets
              key: qdrant-url
              optional: true
        - name: NEO4J_URI
          valueFrom:
            secretKeyRef:
              name: aether-secrets
              key: neo4j-uri
              optional: true
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: aether-secrets
              key: redis-url
              optional: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: aether-api
  namespace: default
  labels:
    app.kubernetes.io/name: aether-api
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: aether-api
