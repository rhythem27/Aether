name: 🐛 Bug Report
description: Report a bug or unintended behavior in the Aether platform
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting a bug! Please fill out the form below to help us reproduce and resolve it.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Provide a clear and concise description of the bug.
      placeholder: What happened unexpectedly?
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: List the step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Run endpoint POST /api/v1/research/deep-dive
        2. Pass body {"target_company": "NVDA"}
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Python version, Docker version, etc.
      placeholder: Windows 11 / Python 3.11 / Docker 26.0

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Tracebacks
      description: Paste any terminal logs or stack tracebacks.
      render: shell
