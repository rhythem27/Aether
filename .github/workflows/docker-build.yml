name: Production Docker Build Checks

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]

jobs:
  docker-build-verification:
    name: Build & Verify Production Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.api
          push: false
          tags: aether/api:test

      - name: Build Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.worker
          push: false
          tags: aether/worker:test

      - name: Build MCP Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.mcp-server
          push: false
          tags: aether/mcp-sec-edgar:test
